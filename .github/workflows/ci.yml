name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  types:
    name: Types (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package:
          - '@zerodep-vue/compiler'
          - '@zerodep-vue/core'
          - '@zerodep-vue/ui'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check package types
        env:
          CHECK_PACKAGE: ${{ matrix.package }}
        run: pnpm --filter "$CHECK_PACKAGE" run check

  compiler:
    name: Compiler and SSR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zerodep-vue/compiler test

  upstream:
    name: Upstream (${{ matrix.mode }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [official, fork]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run original Vue JSX assertions and snapshots
        env:
          TEST_MODE: ${{ matrix.mode }}
          TEST_SHARD: ${{ matrix.shard }}
        run: pnpm --filter @zerodep-vue/compiler test:upstream --mode "$TEST_MODE" --shard "$TEST_SHARD/2" --reporter default --reporter json --outputFile "test-results/upstream-$TEST_MODE-$TEST_SHARD.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upstream-${{ matrix.mode }}-${{ matrix.shard }}-${{ github.sha }}
          path: packages/compiler/test-results/upstream-*.json
          if-no-files-found: warn
          retention-days: 7

  core:
    name: Core runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zerodep-vue/core css:generate:check
      - run: pnpm --filter @zerodep-vue/core test

  authoring:
    name: TSX authoring (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [default, optimized]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run component authoring contracts
        env:
          AUTHORING_MODE: ${{ matrix.mode }}
        run: pnpm --filter @zerodep-vue/core test:authoring --mode "$AUTHORING_MODE"

  ui:
    name: UI foundations (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [default, optimized]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Verify peer values, TSX, SSR and production emission
        env:
          UI_MODE: ${{ matrix.mode }}
        run: pnpm --filter @zerodep-vue/ui test --mode "$UI_MODE"

  build:
    name: Build and package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Verify CSS author runtime size from built packages
        run: pnpm --filter @zerodep-vue/core css:bundle
      - name: Pack complete artifacts and verify emitted-source provenance
        run: pnpm packages:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.sha }}
          path: |
            packages/*/dist/
            test-results/packages/*.tgz
            test-results/packages/pack.json
            packages/core/test-results/css-bundle.json
          if-no-files-found: error
          retention-days: 7

  language:
    name: LSP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lsp:setup
      - run: pnpm lsp:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lsp-${{ matrix.os }}-${{ github.sha }}
          path: test-results/language-services/verification.json
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI result
    if: always()
    needs: [format, types, compiler, upstream, core, authoring, ui, build, language]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.CI_JOB_RESULTS);
          const failed = Object.entries(jobs).filter(([, job]) => job.result !== 'success');
          for (const [name, job] of Object.entries(jobs)) console.log(name + ': ' + job.result);
          if (failed.length) process.exit(1);
          NODE
